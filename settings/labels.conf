# Labels are pattern-based and configurable.
# Scan first; label only from evidence.

LIVE_PATTERNS="live public customer primary"
STAGING_PATTERNS="stage staging prelive uat qa test"
DEVELOPMENT_PATTERNS="dev development sandbox lab preview demo nonlive"

# Optional domain suffixes. Leave blank for generic discovery.
# Private use only: add organization-approved suffixes in your local copy.
LIVE_DOMAIN_SUFFIXES=""
STAGING_DOMAIN_SUFFIXES=""
DEVELOPMENT_DOMAIN_SUFFIXES=""

# Nginx generation renders one server block per mapping row whose confidence is
# not "none". Set to "unknown" to include unknown mappings too.
NGINX_RENDER_MIN_CONFIDENCE="low"
